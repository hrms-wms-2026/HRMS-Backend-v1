# Builds backend + web app + admin console into one App Service package and deploys it to the App Service named by vars.APPSERVICE_NAME.
# Setup (secrets, variables, portal switches): ops/appservice/deploy-pipeline-setup.md
#
# Runs on:
#   - a merge to main in this repo
#   - a merge to main in the web or admin repo (their trigger-appservice-deploy.yml sends repository_dispatch)
#   - the "Run workflow" button (pick refs; optionally apply database migrations)
# No tests here: ci.yml already tests pull requests.
#
# Two jobs on purpose: "build" runs npm install scripts and never sees the Azure publish profile or the
# database secret; "deploy" only receives the finished zip.
name: Deploy to App Service

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-appservice]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag or SHA
        type: string
        default: main
      web_ref:
        description: Web app branch, tag or SHA
        type: string
        default: main
      admin_ref:
        description: Admin console branch, tag or SHA
        type: string
        default: main
      apply_migrations:
        description: Apply EF migrations to the database before deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-appservice
  cancel-in-progress: false

env:
  ORG: hrms-wms-2026

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_sha: ${{ steps.shas.outputs.backend }}
      web_sha: ${{ steps.shas.outputs.web }}
      admin_sha: ${{ steps.shas.outputs.admin }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
    steps:
      - name: Check required settings
        env:
          HAS_FRONTEND_TOKEN: ${{ secrets.FRONTEND_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_FRONTEND_TOKEN" != "true" ]; then
            echo "::error::Missing secret FRONTEND_READ_TOKEN. See ops/appservice/deploy-pipeline-setup.md"
            exit 1
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_ref || (github.event_name == 'push' && github.sha) || 'main' }}
          path: backend
          persist-credentials: false

      - name: Checkout web app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/Hrms--Web-application---front-end---v1
          ref: ${{ inputs.web_ref || 'main' }}
          token: ${{ secrets.FRONTEND_READ_TOKEN }}
          path: web
          persist-credentials: false

      - name: Checkout admin console
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/HRMS-Platform-Administration-Front-End-v1
          ref: ${{ inputs.admin_ref || 'main' }}
          token: ${{ secrets.FRONTEND_READ_TOKEN }}
          path: admin
          persist-credentials: false

      - name: Record commits
        id: shas
        run: |
          for d in backend web admin; do
            echo "$d=$(git -C "$d" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin/package-lock.json

      - name: Install web app dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install admin console dependencies
        working-directory: admin
        run: npm ci --no-audit --no-fund

      - name: Build package
        id: package
        shell: pwsh
        run: >
          ./backend/ops/appservice/build-appservice-package.ps1
          -Mode '${{ vars.PACKAGE_MODE || 'SingleHost' }}'
          -WebRepo "$PWD/web"
          -AdminRepo "$PWD/admin"
          -OutDir '${{ runner.temp }}'
          -ZipName crownus-appservice.zip

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: appservice-package
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: appservice-test
    timeout-minutes: 30
    env:
      APP_NAME: ${{ vars.APPSERVICE_NAME }}
      APPSERVICE_HOST: ${{ vars.APPSERVICE_HOST }}
    steps:
      - name: Check required settings
        env:
          HAS_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        run: |
          missing=""
          [ "$HAS_PROFILE" = "true" ] || missing="$missing secret:AZURE_WEBAPP_PUBLISH_PROFILE"
          [ -n "$APPSERVICE_HOST" ] || missing="$missing variable:APPSERVICE_HOST"
          [ -n "$APP_NAME" ] || missing="$missing variable:APPSERVICE_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Missing settings:$missing. See ops/appservice/deploy-pipeline-setup.md"
            exit 1
          fi

      # --- database migrations (manual runs only, when apply_migrations is ticked) ---
      # Runs as crownus_migrator (db_ddladmin). It cannot GRANT, so ops/sqlserver/post-migration-grants.sql
      # stays a manual step with an admin login; its grants are schema-wide, so new dbo tables are covered.
      # Only backend code (no npm packages) runs in this job.

      - name: Check migration settings
        if: ${{ inputs.apply_migrations }}
        env:
          HAS_MIGRATION_CONNECTION: ${{ secrets.MIGRATION_CONNECTION_STRING != '' }}
        run: |
          if [ "$HAS_MIGRATION_CONNECTION" != "true" ]; then
            echo "::error::apply_migrations is ticked but secret MIGRATION_CONNECTION_STRING is missing. See ops/appservice/deploy-pipeline-setup.md"
            exit 1
          fi

      - name: Checkout backend (same commit as the package)
        if: ${{ inputs.apply_migrations }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.backend_sha }}
          path: backend
          persist-credentials: false

      - name: Setup .NET
        if: ${{ inputs.apply_migrations }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build EF migration bundle
        if: ${{ inputs.apply_migrations }}
        env:
          # The design-time DbContext factory reads this at build time as well as at run time.
          ConnectionStrings__MigrationConnection: ${{ secrets.MIGRATION_CONNECTION_STRING }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          dotnet ef migrations bundle \
            -p backend/src/ONEVO.Infrastructure \
            -s backend/src/ONEVO.Api \
            -r linux-x64 --self-contained \
            -o "$RUNNER_TEMP/efbundle"

      - name: Apply migrations
        if: ${{ inputs.apply_migrations }}
        # The bundle needs appsettings.json in the current folder.
        working-directory: backend/src/ONEVO.Api
        env:
          ConnectionStrings__MigrationConnection: ${{ secrets.MIGRATION_CONNECTION_STRING }}
        run: |
          "$RUNNER_TEMP/efbundle" --connection "$ConnectionStrings__MigrationConnection"

      # --- deploy ---

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: appservice-package
          path: ${{ runner.temp }}/package

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/package/crownus-appservice.zip

      - name: Wait for /health/ready
        run: |
          url="https://${APPSERVICE_HOST}/health/ready"
          for i in $(seq 1 20); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
            echo "Attempt $i: $url -> $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 15
          done
          echo "::error::$url did not return 200 within 5 minutes. Check App Service > Log stream and the app settings."
          exit 1

      - name: Run summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE: ${{ github.event.client_payload.source }}
          BACKEND_SHA: ${{ needs.build.outputs.backend_sha }}
          WEB_SHA: ${{ needs.build.outputs.web_sha }}
          ADMIN_SHA: ${{ needs.build.outputs.admin_sha }}
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
          JOB_STATUS: ${{ job.status }}
          MIGRATIONS: ${{ inputs.apply_migrations && 'applied' || 'not run' }}
        run: |
          {
            echo "### Deploy to ${APP_NAME}: ${JOB_STATUS}"
            echo ""
            echo "- Trigger: \`${EVENT_NAME}\`${DISPATCH_SOURCE:+ from \`${DISPATCH_SOURCE}\`}"
            echo "- backend: \`${BACKEND_SHA}\`"
            echo "- web: \`${WEB_SHA}\`"
            echo "- admin: \`${ADMIN_SHA}\`"
            echo "- Package SHA-256: \`${ZIP_SHA256}\`"
            echo "- Database migrations: ${MIGRATIONS}"
          } >> "$GITHUB_STEP_SUMMARY"
