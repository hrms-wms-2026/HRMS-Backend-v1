# Builds backend + web app + admin console into one App Service package and deploys it to the App Service named by vars.APPSERVICE_NAME.
# Setup (secrets, variables, portal switches): ops/appservice/deploy-pipeline-setup.md
#
# Runs on:
#   - a merge to main in this repo
#   - a merge to main in the web or admin repo (their trigger-appservice-deploy.yml sends repository_dispatch)
#   - the "Run workflow" button (pick refs; optionally apply database migrations)
# No tests here: ci.yml already tests pull requests.
#
# Two jobs on purpose: "build" runs npm install scripts and never sees the Azure publish profile or the
# database secret; "deploy" only receives the finished zip.
name: Deploy to App Service

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [deploy-appservice]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Backend branch, tag or SHA
        type: string
        default: main
      web_ref:
        description: Web app branch, tag or SHA
        type: string
        default: main
      admin_ref:
        description: Admin console branch, tag or SHA
        type: string
        default: main
      apply_migrations:
        description: Apply EF migrations to the database before deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-appservice
  cancel-in-progress: false

env:
  ORG: hrms-wms-2026

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      backend_sha: ${{ steps.shas.outputs.backend }}
      web_sha: ${{ steps.shas.outputs.web }}
      admin_sha: ${{ steps.shas.outputs.admin }}
      zip_sha256: ${{ steps.package.outputs.zip_sha256 }}
      build_id: ${{ steps.package.outputs.build_id }}
    steps:
      - name: Check required settings
        env:
          HAS_FRONTEND_TOKEN: ${{ secrets.FRONTEND_READ_TOKEN != '' }}
        run: |
          if [ "$HAS_FRONTEND_TOKEN" != "true" ]; then
            echo "::error::Missing secret FRONTEND_READ_TOKEN. See ops/appservice/deploy-pipeline-setup.md"
            exit 1
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.backend_ref || (github.event_name == 'push' && github.sha) || 'main' }}
          path: backend
          persist-credentials: false

      - name: Checkout web app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/Hrms--Web-application---front-end---v1
          ref: ${{ inputs.web_ref || 'main' }}
          token: ${{ secrets.FRONTEND_READ_TOKEN }}
          path: web
          persist-credentials: false

      - name: Checkout admin console
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORG }}/HRMS-Platform-Administration-Front-End-v1
          ref: ${{ inputs.admin_ref || 'main' }}
          token: ${{ secrets.FRONTEND_READ_TOKEN }}
          path: admin
          persist-credentials: false

      - name: Record commits
        id: shas
        run: |
          for d in backend web admin; do
            echo "$d=$(git -C "$d" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          done

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            admin/package-lock.json

      - name: Install web app dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install admin console dependencies
        working-directory: admin
        run: npm ci --no-audit --no-fund

      - name: Build package
        id: package
        shell: pwsh
        env:
          PACKAGE_MODE: ${{ vars.PACKAGE_MODE || 'SingleHost' }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: >
          ./backend/ops/appservice/build-appservice-package.ps1
          -Mode $env:PACKAGE_MODE
          -WebRepo "$PWD/web"
          -AdminRepo "$PWD/admin"
          -OutDir $env:RUNNER_TEMP
          -ZipName crownus-appservice.zip
          -BuildId $env:BUILD_ID

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: appservice-package
          path: ${{ steps.package.outputs.zip_path }}
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: appservice-test
    timeout-minutes: 30
    env:
      APP_NAME: ${{ vars.APPSERVICE_NAME }}
      APPSERVICE_HOST: ${{ vars.APPSERVICE_HOST }}
    steps:
      - name: Check required settings
        env:
          HAS_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
        run: |
          missing=""
          [ "$HAS_PROFILE" = "true" ] || missing="$missing secret:AZURE_WEBAPP_PUBLISH_PROFILE"
          [ -n "$APPSERVICE_HOST" ] || missing="$missing variable:APPSERVICE_HOST"
          [ -n "$APP_NAME" ] || missing="$missing variable:APPSERVICE_NAME"
          if [ -n "$missing" ]; then
            echo "::error::Missing settings:$missing. See ops/appservice/deploy-pipeline-setup.md"
            exit 1
          fi

      # --- database migrations (manual runs only, when apply_migrations is ticked) ---
      # Runs as crownus_migrator (db_ddladmin). It cannot GRANT, so ops/sqlserver/post-migration-grants.sql
      # stays a manual step with an admin login; its grants are schema-wide, so new dbo tables are covered.
      # Only backend code (no npm packages) runs in this job.

      - name: Check migration settings
        if: ${{ inputs.apply_migrations }}
        env:
          HAS_MIGRATION_CONNECTION: ${{ secrets.MIGRATION_CONNECTION_STRING != '' }}
        run: |
          if [ "$HAS_MIGRATION_CONNECTION" != "true" ]; then
            echo "::error::apply_migrations is ticked but secret MIGRATION_CONNECTION_STRING is missing. See ops/appservice/deploy-pipeline-setup.md"
            exit 1
          fi

      - name: Checkout backend (same commit as the package)
        if: ${{ inputs.apply_migrations }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.backend_sha }}
          path: backend
          persist-credentials: false

      - name: Setup .NET
        if: ${{ inputs.apply_migrations }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build EF migration bundle
        if: ${{ inputs.apply_migrations }}
        env:
          # The design-time DbContext factory reads this at build time as well as at run time.
          ConnectionStrings__MigrationConnection: ${{ secrets.MIGRATION_CONNECTION_STRING }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.9
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef migrations bundle \
            -p backend/src/ONEVO.Infrastructure \
            -s backend/src/ONEVO.Api \
            -r linux-x64 --self-contained \
            -o "$RUNNER_TEMP/efbundle"

      - name: Apply migrations
        id: migrate
        if: ${{ inputs.apply_migrations }}
        # The bundle needs appsettings.json in the current folder.
        working-directory: backend/src/ONEVO.Api
        env:
          ConnectionStrings__MigrationConnection: ${{ secrets.MIGRATION_CONNECTION_STRING }}
        run: |
          "$RUNNER_TEMP/efbundle" --connection "$ConnectionStrings__MigrationConnection"

      # --- deploy ---

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: appservice-package
          path: ${{ runner.temp }}/package

      - name: Deploy to App Service
        # Pinned to a commit: this step receives the publish profile. 02a81bea = v3.0.8 (what v3 pointed to on 2026-11-19).
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ runner.temp }}/package/crownus-appservice.zip

      # webapps-deploy can return before the site restarts, while the OLD app still answers. So first wait
      # until the site serves this run's build id, then require /health/ready = 200. Hard 10-minute deadline.
      - name: Wait for the new build and /health/ready
        env:
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          base="https://${APPSERVICE_HOST}"
          deadline=$((SECONDS + 600))
          new_build=false
          while [ "$SECONDS" -lt "$deadline" ]; do
            if [ "$new_build" = "false" ]; then
              served=$(curl -sS --max-time 15 "$base/build-id.txt" 2>/dev/null || true)
              if [ "$served" = "$BUILD_ID" ]; then
                new_build=true
                echo "New build is live: $BUILD_ID"
              else
                echo "Waiting for build $BUILD_ID (site serves: ${served:-nothing})"
              fi
            fi
            if [ "$new_build" = "true" ]; then
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$base/health/ready" 2>/dev/null) || code=000
              echo "/health/ready -> $code"
              if [ "$code" = "200" ]; then exit 0; fi
            fi
            sleep 15
          done
          if [ "$new_build" = "false" ]; then
            echo "::error::The site never served build $BUILD_ID within 10 minutes; the new version did not start. Check App Service > Log stream."
          else
            echo "::error::$base/health/ready did not return 200 within 10 minutes. Check App Service > Log stream and the app settings."
          fi
          exit 1

      # --- post-deploy smoke test (task 29, docs/deployment/release-gate.md) ---
      # One pass of the k6 user journeys against the new build, signed in with UAT test accounts. Off until
      # vars.LOADTEST_SMOKE is 'true'. A failed smoke fails the deploy run; the new build stays live, so roll back
      # by redeploying the previous commits (docs/runbooks/uat-deploy.md).

      - name: Checkout load test (same commit as the package)
        if: ${{ vars.LOADTEST_SMOKE == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.backend_sha }}
          path: smoke
          sparse-checkout: ops/loadtest
          persist-credentials: false

      - name: Smoke test (k6)
        id: smoke
        if: ${{ vars.LOADTEST_SMOKE == 'true' }}
        env:
          LOADTEST_USERS: ${{ secrets.LOADTEST_USERS }}
          LOADTEST_PASSWORD: ${{ secrets.LOADTEST_PASSWORD }}
          LOADTEST_TENANT: ${{ vars.LOADTEST_TENANT }}
        run: |
          if [ -z "$LOADTEST_USERS" ] || [ -z "$LOADTEST_PASSWORD" ] || [ -z "$LOADTEST_TENANT" ]; then
            echo "::error::LOADTEST_SMOKE is on but secret LOADTEST_USERS, secret LOADTEST_PASSWORD or variable LOADTEST_TENANT is missing. See ops/loadtest/README.md"
            exit 1
          fi
          # Single-host App Service: one host, the tenant from the X-Crownus-Tenant header.
          docker run --rm -v "$PWD/smoke/ops/loadtest:/work" -w /work \
            -e PROFILE=smoke -e ROOT_URL="https://${APPSERVICE_HOST}" -e TENANT_URL="https://${APPSERVICE_HOST}" \
            -e TENANT_HEADER="$LOADTEST_TENANT" -e USERS="$LOADTEST_USERS" -e PASSWORD="$LOADTEST_PASSWORD" \
            grafana/k6@sha256:1f40432b1cbe7234e977f96c362c9bc550a2d2b583d014dd8669fe40d3e9e755 run --quiet journeys.js

      - name: Run summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE: ${{ github.event.client_payload.source }}
          BACKEND_SHA: ${{ needs.build.outputs.backend_sha }}
          WEB_SHA: ${{ needs.build.outputs.web_sha }}
          ADMIN_SHA: ${{ needs.build.outputs.admin_sha }}
          ZIP_SHA256: ${{ needs.build.outputs.zip_sha256 }}
          JOB_STATUS: ${{ job.status }}
          MIGRATIONS: ${{ inputs.apply_migrations && steps.migrate.outcome || 'not requested' }}
          SMOKE: ${{ vars.LOADTEST_SMOKE == 'true' && steps.smoke.outcome || 'off' }}
          BUILD_ID: ${{ needs.build.outputs.build_id }}
        run: |
          {
            echo "### Deploy to ${APP_NAME}: ${JOB_STATUS}"
            echo ""
            echo "- Trigger: \`${EVENT_NAME}\`${DISPATCH_SOURCE:+ from \`${DISPATCH_SOURCE}\`}"
            echo "- backend: \`${BACKEND_SHA}\`"
            echo "- web: \`${WEB_SHA}\`"
            echo "- admin: \`${ADMIN_SHA}\`"
            echo "- Package SHA-256: \`${ZIP_SHA256}\`"
            echo "- Build id: \`${BUILD_ID}\`"
            echo "- Database migrations: ${MIGRATIONS}"
            echo "- Smoke test: ${SMOKE}"
          } >> "$GITHUB_STEP_SUMMARY"
