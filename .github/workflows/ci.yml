name: CI

on:
  pull_request:
    branches: [main, testing, development]
  push:
    branches: [main, testing, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test - Unit
        run: dotnet test tests/ONEVO.Tests.Unit/ONEVO.Tests.Unit.csproj --no-build --configuration Release

      - name: Test - Architecture
        run: dotnet test tests/ONEVO.Tests.Architecture/ONEVO.Tests.Architecture.csproj --no-build --configuration Release

      - name: Test - Integration
        run: dotnet test tests/ONEVO.Tests.Integration/ONEVO.Tests.Integration.csproj --no-build --configuration Release
