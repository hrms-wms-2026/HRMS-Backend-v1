name: CI

on:
  pull_request:
    branches: [main, testing, development]
  push:
    branches: [main, testing, development]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build API (restores Domain/Application/Infrastructure via project refs)
        run: dotnet build src/ONEVO.Api/ONEVO.Api.csproj --configuration Release

      - name: Test - Unit
        run: dotnet test tests/ONEVO.Tests.Unit/ONEVO.Tests.Unit.csproj --configuration Release

      - name: Test - Architecture
        run: dotnet test tests/ONEVO.Tests.Architecture/ONEVO.Tests.Architecture.csproj --configuration Release

      - name: Test - Integration
        run: dotnet test tests/ONEVO.Tests.Integration/ONEVO.Tests.Integration.csproj --configuration Release
