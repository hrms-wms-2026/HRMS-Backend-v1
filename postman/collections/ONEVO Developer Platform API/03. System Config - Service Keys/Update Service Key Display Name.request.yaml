$kind: http-request
name: Update Service Key Display Name
method: PUT
url: '{{admin_base_url}}/admin/v1/system-config/service-keys/{{service_key}}'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{admin_csrf_token}}'
body:
  type: json
  content: |-
    {
      "displayName": "SendGrid Primary Transactional Email"
    }
