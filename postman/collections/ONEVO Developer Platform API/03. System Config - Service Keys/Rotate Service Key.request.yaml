$kind: http-request
name: Rotate Service Key
method: POST
url: '{{admin_base_url}}/admin/v1/system-config/service-keys/{{service_key}}/rotate-key'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{admin_csrf_token}}'
body:
  type: json
  content: |-
    {
      "apiKey": "SG.newxxxxxxxxxxxxxxxxxxxxx"
    }
