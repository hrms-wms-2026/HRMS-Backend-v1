$kind: http-request
name: Rotate Gateway Credentials
method: POST
url: '{{admin_base_url}}/admin/v1/system-config/payment-gateways/{{gateway_config_id}}/credentials/rotate'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{admin_csrf_token}}'
body:
  type: json
  content: |-
    {
      "secretKey": "sk_test_newxxxxxxxxx",
      "webhookSecret": "whsec_newxxxxxxxxx"
    }
