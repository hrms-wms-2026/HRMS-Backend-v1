$kind: http-request
name: Verify Stripe Credentials
method: POST
url: '{{admin_base_url}}/admin/v1/system-config/payment-gateways/verify'
order: 2000
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{admin_csrf_token}}'
body:
  type: json
  content: |-
    {
      "provider": "stripe",
      "credentials": {
        "secretKey": "sk_test_xxxxxxxxx",
        "publishableKey": "pk_test_xxxxxxxxx"
      }
    }
