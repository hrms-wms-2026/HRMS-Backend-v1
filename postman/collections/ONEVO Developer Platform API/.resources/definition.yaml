$kind: collection
name: ONEVO Developer Platform API
description: |-
  # ONEVO Developer Platform API

  This collection contains platform-admin APIs used by ONEVO internal/developer-platform users.

  It covers:

  - Platform admin authentication
      
  - System configuration
      
  - Platform service keys such as SendGrid/Resend
      
  - OAuth provider configuration such as Google/GitHub/Microsoft/Zoom
      
  - Payment gateway configuration
      
  - Tenant creation and provisioning management
      

  Authentication:

  - Login through the admin auth endpoint.
      
  - The backend issues an `admin_session` cookie.
      
  - Mutating admin requests require the `admin_csrf` cookie value to be sent as `X-CSRF-Token`.
      

  Base URL:  
  `{{admin_base_url}}`

  Important:

  - Do not put provider secrets in environment files.
      
  - Provider credentials are saved through System Config APIs and encrypted in the database.
      
  - Only ONEVO platform admins should use this collection.
