$kind: http-request
name: Configure GitHub OAuth
method: PUT
url: '{{admin_base_url}}/admin/v1/system-config/oauth-apps/github'
order: 4000
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{admin_csrf_token}}'
body:
  type: json
  content: |-
    {
      "appName": "ONEVO GitHub OAuth",
      "logoUrl": null,
      "clientId": "github-client-id",
      "clientSecret": "github-client-secret",
      "privateKey": null,
      "isActive": true
    }
