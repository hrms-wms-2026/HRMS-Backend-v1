$kind: http-request
name: Rotate OAuth Secret
method: POST
url: '{{admin_base_url}}/admin/v1/system-config/oauth-apps/google/rotate-secret'
order: 5000
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{admin_csrf_token}}'
body:
  type: json
  content: |-
    {
      "clientSecret": "GOCSPX-new-secret",
      "privateKey": null
    }
