$kind: http-request
name: Confirm Provisioning
method: PATCH
url: '{{admin_base_url}}/admin/v1/tenants/{{tenant_id}}/provision/confirm'
order: 9000
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{admin_csrf_token}}'
body:
  type: json
  content: |-
    {
      "confirm": true
    }
