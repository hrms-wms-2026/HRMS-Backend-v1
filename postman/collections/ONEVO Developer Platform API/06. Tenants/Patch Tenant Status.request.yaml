$kind: http-request
name: Change Tenant Status
method: PATCH
url: '{{admin_base_url}}/admin/v1/tenants/{{tenant_id}}/status'
order: 6000
headers:
  - key: Content-Type
    value: application/json
  - key: X-CSRF-Token
    value: '{{admin_csrf_token}}'
body:
  type: json
  content: |-
    {
      "action": "suspend",
      "reason": "Manual test suspension"
    }
