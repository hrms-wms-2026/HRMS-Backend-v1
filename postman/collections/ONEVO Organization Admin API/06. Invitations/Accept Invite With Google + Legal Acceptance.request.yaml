$kind: http-request
name: 'Accept Invitation With Google'
method: POST
url: '{{tenant_host}}/api/v1/auth/invitations/{{invite_token}}/accept-google'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "google_id_token": "<google-id-token>",
      "acceptances": [
        {
          "document_type": "privacy_notice",
          "version": "1.0",
          "decision": "accepted"
        },
        {
          "document_type": "terms",
          "version": "1.0",
          "decision": "accepted"
        }
      ]
    }
