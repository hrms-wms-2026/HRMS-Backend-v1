$kind: http-request
name: 'Accept Invitation With Password'
method: POST
url: '{{tenant_host}}/api/v1/auth/invitations/{{invite_token}}/accept-password'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "password": "Password123!",
      "confirm_password": "Password123!",
      "acceptances": [
        {
          "document_type": "privacy_notice",
          "version": "1.0",
          "decision": "accepted"
        },
        {
          "document_type": "terms",
          "version": "1.0",
          "decision": "accepted"
        }
      ]
    }
