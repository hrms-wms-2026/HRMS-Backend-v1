$kind: http-request
name: Force Change Password
method: POST
url: '{{tenant_host}}/api/v1/auth/force-change-password'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{tenant_email}}",
      "currentPassword": "Password123!",
      "newPassword": "NewPassword123!"
    }
