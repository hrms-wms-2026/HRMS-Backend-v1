$kind: http-request
name: Tenant Login
method: POST
url: '{{tenant_host}}/api/v1/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{tenant_email}}",
      "password": "{{tenant_password}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const csrf = pm.cookies.get("onevo_csrf");
      if (csrf) pm.environment.set("tenant_csrf_token", csrf);

      const legalCsrf = pm.cookies.get("onevo_legal_csrf");
      if (legalCsrf) pm.environment.set("legal_csrf_token", legalCsrf);
