$kind: http-request
name: Select Workspace
method: POST
url: '{{base_url}}/api/v1/auth/login/select-workspace'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "login_challenge": "{{login_challenge}}",
      "workspace": "{{tenant_slug}}"
    }
