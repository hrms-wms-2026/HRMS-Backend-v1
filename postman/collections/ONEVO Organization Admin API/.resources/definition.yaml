$kind: collection
description: |-
  # ONEVO Organization Admin API

  This collection contains tenant/customer-facing APIs used by organization owners, admins, and users.

  It covers:

  - Tenant login from base domain or tenant host
      
  - Workspace selection
      
  - Legal acceptance before session creation
      
  - MFA setup and verification
      
  - Password reset
      
  - Invitation acceptance
      
  - Tenant-owned business APIs
      

  Authentication:

  - Tenant login issues a `onevo_session` cookie.
      
  - Mutating tenant requests require the `onevo_csrf` cookie value to be sent as `X-CSRF-Token`.
      
  - Pending legal acceptance uses `onevo_legal_pending` and `onevo_legal_csrf`.
      
  - Legal CSRF must be sent in the `X-CSRF-Token` header, not in the body.
      

  Base URLs:

  - Base-domain login: `{{base_url}}`
      
  - Tenant-host login: `http://{{tenant_slug}}.localhost:5139`
      

  Important:

  - Tenant ID must never be sent from the browser body/header.
      
  - Tenant context is resolved by host or by secure login challenge.
      
  - Organization APIs are tenant-isolated by backend RLS.
